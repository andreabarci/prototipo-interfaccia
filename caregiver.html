<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Prototipo · strumento del caregiver</title>

  <!-- Mapbox GL JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.26.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.26.0/mapbox-gl.js"></script>

  <link href="css/style.css" rel="stylesheet">
</head>
<body class="locked">
  <div class="gate" id="gate">
    <form class="gate__box" id="gate-form">
      <p class="eyebrow">Prototipo di tesi</p>
      <label for="gate-input">Password</label>
      <input id="gate-input" type="password" autocomplete="current-password" required>
      <button type="submit">Entra</button>
      <p class="gate__error" id="gate-error" hidden>Password non corretta.</p>
    </form>
  </div>

  <div class="app app--caregiver" id="app">
    <!-- Tendina sinistra: la chat, comprimibile -->
    <aside class="panel panel--sx chat" id="panel-sx">
      <div class="chat__testata">
        <p class="eyebrow">Chat</p>
        <button class="chat__comprimi" id="chat-comprimi" type="button" aria-label="Comprimi la chat">‹</button>
      </div>
      <div class="chat__scambio" id="chat-scambio"></div>
      <form class="chat__barra" id="chat-form" autocomplete="off">
        <input type="text" id="chat-input" placeholder="Che cosa stai cercando?">
        <button type="submit" aria-label="Invia">↑</button>
      </form>
    </aside>

    <main class="stage">
      <div id="map"></div>
      <!-- Raggio del quartiere: − 15 min a piedi + (il testo lo scrive js/caregiver.js) -->
      <div class="raggio" id="raggio">
        <button type="button" class="raggio__passo" data-passo="-1" aria-label="Meno minuti a piedi">−</button>
        <span class="raggio__valore" id="raggio-valore" aria-live="polite"></span>
        <button type="button" class="raggio__passo" data-passo="1" aria-label="Più minuti a piedi">+</button>
      </div>
    </main>

    <!-- Tendina destra: sempre aperta. Il contenuto (i due tab, oppure la scheda del marker) lo
         scrive js/caregiver.js -->
    <aside class="panel panel--dx caregiver-dx" id="panel-dx"></aside>
  </div>

  <script src="js/config.js"></script>
  <script src="js/condiviso.js"></script>
  <script src="js/caregiver.js"></script>
  <script src="js/gate.js"></script>
</body>
</html>
