<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Prototipo · strumento del case manager</title>

  <!-- Mapbox GL JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.26.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.26.0/mapbox-gl.js"></script>

  <link href="css/style.css" rel="stylesheet">
</head>
<body class="locked">
  <div class="gate" id="gate">
    <form class="gate__box" id="gate-form">
      <p class="eyebrow">Prototipo di tesi</p>
      <label for="gate-input">Password</label>
      <input id="gate-input" type="password" autocomplete="current-password" required>
      <button type="submit">Entra</button>
      <p class="gate__error" id="gate-error" hidden>Password non corretta.</p>
    </form>
  </div>

  <!-- Case manager: la mappa a tutta pagina, con sopra tre elementi volanti (vedi js/app.js e la
       sezione «Case manager» di css/style.css). -->
  <div class="app app--cm" id="app">
    <main class="stage"><div id="map"></div></main>

    <!-- Cartella della persona, in alto a sinistra: persona, domicilio, selettore del bisogno -->
    <section class="cm-volante cm-cartella" id="cartella"></section>

    <!-- Legenda, in basso a sinistra, senza sfondo -->
    <div class="cm-legenda" id="legenda"></div>

    <!-- Scheda volante a destra: dell'ente (clic su un marker) o del servizio (clic su un servizio) -->
    <aside class="cm-volante cm-scheda" id="scheda" hidden>
      <div class="cm-scheda__pagina" id="scheda-ente"></div>
      <div class="cm-scheda__pagina" id="scheda-servizio" hidden></div>
    </aside>
  </div>

  <script src="js/config.js"></script>
  <script src="js/condiviso.js"></script>
  <script src="js/marker-composto.js"></script>
  <script src="js/app.js"></script>
  <script src="js/gate.js"></script>
</body>
</html>
