<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Prototipo · strumento del case manager</title>

  <!-- Mapbox GL JS -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.26.0/mapbox-gl.css" rel="stylesheet">
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.26.0/mapbox-gl.js"></script>

  <link href="css/style.css" rel="stylesheet">
</head>
<body class="locked">
  <div class="gate" id="gate">
    <form class="gate__box" id="gate-form">
      <p class="eyebrow">Prototipo di tesi</p>
      <label for="gate-input">Password</label>
      <input id="gate-input" type="password" autocomplete="current-password" required>
      <button type="submit">Entra</button>
      <p class="gate__error" id="gate-error" hidden>Password non corretta.</p>
    </form>
  </div>

  <div class="app dx-closed" id="app">
    <aside class="panel panel--sx" id="panel-sx">
      <p class="eyebrow">Tendina sinistra</p>
      <p>Cartella della persona e bisogni.</p>
    </aside>

    <main class="stage">
      <div id="map"></div>
      <div class="selettore-legame" id="selettore-legame" hidden>
        <div class="selettore-legame__pulsanti" id="selettore-legame-pulsanti"></div>
        <p class="selettore-legame__vuoto" id="selettore-legame-vuoto" hidden>Nessun legame di questo tipo</p>
      </div>
    </main>

    <aside class="panel panel--dx" id="panel-dx">
      <button class="panel__close" id="panel-dx-close" type="button" aria-label="Chiudi la tendina">×</button>
      <div class="panel__content" id="panel-dx-content">
        <p class="eyebrow">Tendina destra</p>
        <p>Servizio selezionato.</p>
      </div>
      <!-- Fuori da panel-dx-content apposta: mostraEnte riscrive solo quello sopra, questo blocco
           resta quando si cambia il tipo di legame senza cambiare ente (vedi aggiornaListaLegami). -->
      <div class="legami-collegati" id="legami-collegati" hidden>
        <p class="eyebrow" id="legami-collegati-titolo"></p>
        <p class="meta" id="legami-collegati-vuoto" hidden></p>
        <ul class="servizi" id="legami-collegati-lista"></ul>
      </div>
    </aside>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/gate.js"></script>
</body>
</html>
